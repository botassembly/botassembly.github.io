site_name: BotAssembly
site_url: https://botassembly.org
site_description: Open source tools for building AI agents
site_author: BotAssembly
repo_url: https://github.com/botassembly/botassembly.github.io
repo_name: botassembly/botassembly.github.io

copyright: Copyright &copy; 2025 BotAssembly

theme:
  name: material
  custom_dir: overrides
  # logo: assets/images/logo.png  # Uncomment when logo exists
  # favicon: assets/images/favicon.ico  # Uncomment when favicon exists
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - announce.dismiss

nav:
  - Home: index.md
  - Projects:
    - projects/index.md
    - Foundation:
      - innerloop: projects/innerloop/index.md
      - jn: projects/jn/index.md
      - slimschema: projects/slimschema/index.md
    - Toolkit:
      - Pyxies: projects/pyxies/index.md
      - PureFN: projects/purefn/index.md
      - Fastscan: projects/fastscan/index.md
    - Application:
      - BA: projects/ba/index.md
  - Learn:
    - learn/index.md
    - Tutorials: learn/tutorials/index.md
    - Concepts: learn/concepts/index.md
    - Examples: learn/examples/index.md
  - Blog:
    - blog/index.md
  - Videos: videos/index.md
  - Papers: papers/index.md

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: long
      post_url_format: "{slug}"
      post_excerpt: required
      post_excerpt_separator: <!-- more -->
      archive: true
      archive_name: Archive
      archive_date_format: MMMM yyyy
      categories: true
      categories_name: Categories
      categories_allowed:
        - Announcements
        - Tutorials
        - Deep Dives
        - Releases
      pagination: true
      pagination_per_page: 10
      authors: true
      authors_file: .authors.yml

  - rss:
      match_path: blog/posts/.*
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
      abstract_chars_count: 160
      feed_ttl: 1440
      image: https://botassembly.org/assets/images/logo.png
      pretty_print: true

  - social:
      cards_layout: default
      cards_layout_options:
        background_color: "#7c4dff"
        color: "#ffffff"

  - tags:
      tags_file: tags.md

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/botassembly
      name: BotAssembly on GitHub
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/botassembly
      name: BotAssembly on X
    - icon: fontawesome/brands/youtube
      link: https://youtube.com/@botassembly
      name: BotAssembly on YouTube
    - icon: material/rss
      link: /feed_rss_created.xml
      name: RSS Feed
  # Uncomment when you have GA4 property
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
